[project]
name = "portfolio-optimization-agent"
version = "0.1.0"
description = "Transaction-cost-aware portfolio optimisation agent"
authors = [{ name = "Kabir Kashyap" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "cvxpy>=1.4",
    "httpx>=0.27",
    "orjson>=3.9",
    "scipy>=1.13",
    "scikit-learn>=1.4",
]

[project.scripts]
run-agent = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4",
]
